components:
  schemas:
    GenericQuantityValueField:
      type: object
      properties:
        unit:
          type:
          - string
          - 'null'
        hasValue:
          type: string
      required:
      - hasValue
    PatchedCropGrowthStageObservation:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        activityType:
          type: string
          format: uuid
        title:
          type: string
          maxLength: 200
        details:
          type:
          - string
          - 'null'
        phenomenonTime:
          type: string
          format: date-time
        hasEndDatetime:
          type:
          - string
          - 'null'
          format: date-time
        madeBySensor:
          allOf:
          - $ref: '#/components/schemas/MadeBySensorField'
        hasAgriParcel:
          type: string
          format: uuid
        hasAgriCrop:
          type: string
          format: uuid
        hasResult:
          $ref: '#/components/schemas/GenericQuantityValueField'
        observedProperty:
          type: string
    CropGrowthStageObservation:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        activityType:
          type: string
          format: uuid
        title:
          type: string
          maxLength: 200
        details:
          type:
          - string
          - 'null'
        phenomenonTime:
          type: string
          format: date-time
        hasEndDatetime:
          type:
          - string
          - 'null'
          format: date-time
        madeBySensor:
          allOf:
          - $ref: '#/components/schemas/MadeBySensorField'
        hasAgriParcel:
          type: string
          format: uuid
        hasAgriCrop:
          type: string
          format: uuid
        hasResult:
          $ref: '#/components/schemas/GenericQuantityValueField'
        observedProperty:
          type: string
      required:
      - activityType
      - hasAgriCrop
      - hasAgriParcel
      - hasResult
      - id
      - observedProperty
      - phenomenonTime
    MadeBySensorField:
      type: object
      properties:
        name:
          type:
          - string
          - 'null'
      required:
      - name
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
