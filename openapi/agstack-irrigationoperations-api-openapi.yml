components:
  schemas:
    UsesIrrigationSystemEnum:
      enum:
      - sprinkler
      - drip
      - centre_pivot
      - furrow
      - terraced
      type: string
      description: '* `sprinkler` - Sprinkler

        * `drip` - Drip

        * `centre_pivot` - Centre Pivot

        * `furrow` - Furrow

        * `terraced` - Terraced'
    AppliedAmmountField:
      type: object
      properties:
        unit:
          type: string
        numericValue:
          type: string
          format: decimal
          pattern: ^-?\d{0,15}(?:\.\d{0,2})?$
      required:
      - numericValue
      - unit
    IrrigationOperation:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        activityType:
          type: string
          format: uuid
        title:
          type: string
          maxLength: 200
        details:
          type:
          - string
          - 'null'
        hasStartDatetime:
          type: string
          format: date-time
        hasEndDatetime:
          type:
          - string
          - 'null'
          format: date-time
        responsibleAgent:
          type:
          - string
          - 'null'
        usesAgriculturalMachinery:
          type: array
          items:
            type: string
            format: uuid
        hasAppliedAmount:
          $ref: '#/components/schemas/AppliedAmmountField'
        usesIrrigationSystem:
          $ref: '#/components/schemas/UsesIrrigationSystemEnum'
        operatedOn:
          type: string
          format: uuid
      required:
      - activityType
      - hasAppliedAmount
      - hasStartDatetime
      - id
      - operatedOn
      - usesAgriculturalMachinery
      - usesIrrigationSystem
    PatchedIrrigationOperation:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        activityType:
          type: string
          format: uuid
        title:
          type: string
          maxLength: 200
        details:
          type:
          - string
          - 'null'
        hasStartDatetime:
          type: string
          format: date-time
        hasEndDatetime:
          type:
          - string
          - 'null'
          format: date-time
        responsibleAgent:
          type:
          - string
          - 'null'
        usesAgriculturalMachinery:
          type: array
          items:
            type: string
            format: uuid
        hasAppliedAmount:
          $ref: '#/components/schemas/AppliedAmmountField'
        usesIrrigationSystem:
          $ref: '#/components/schemas/UsesIrrigationSystemEnum'
        operatedOn:
          type: string
          format: uuid
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
