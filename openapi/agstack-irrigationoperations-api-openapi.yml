            schema:
              $ref: '#/components/schemas/IrrigationOperation'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/IrrigationOperation'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/IrrigationOperation'
        required: true
      security:
      - cookieAuth: []
      responses:
