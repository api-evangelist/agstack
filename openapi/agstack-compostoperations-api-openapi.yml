components:
  schemas:
    MadeBySensorField:
      type: object
      properties:
        name:
          type:
          - string
          - 'null'
      required:
      - name
    AddRawMaterialOperation:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        activityType:
          type: string
          format: uuid
        title:
          type: string
          maxLength: 200
        details:
          type:
          - string
          - 'null'
        hasStartDatetime:
          type: string
          format: date-time
        hasEndDatetime:
          type:
          - string
          - 'null'
          format: date-time
        operatedOn:
          type: string
          format: uuid
        responsibleAgent:
          type:
          - string
          - 'null'
        usesAgriculturalMachinery:
          type: array
          items:
            type: string
            format: uuid
        hasCompostMaterial:
          type: array
          items:
            $ref: '#/components/schemas/AddRawMaterialCompostQuantity'
      required:
      - activityType
      - hasCompostMaterial
      - hasStartDatetime
      - id
      - operatedOn
      - usesAgriculturalMachinery
    AppliedAmmountField:
      type: object
      properties:
        unit:
          type: string
        numericValue:
          type: string
          format: decimal
          pattern: ^-?\d{0,15}(?:\.\d{0,2})?$
      required:
      - numericValue
      - unit
