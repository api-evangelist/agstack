            schema:
              $ref: '#/components/schemas/VigorEstimationObservation'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/VigorEstimationObservation'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/VigorEstimationObservation'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/ld+json:
              schema:
                $ref: '#/components/schemas/VigorEstimationObservation'
            application/json:
              schema:
                $ref: '#/components/schemas/VigorEstimationObservation'
          description: ''
      summary: Api v1 vigor estimation create
      x-summary-source: derived
  /api/v1/VigorEstimation/{id}/:
    get:
