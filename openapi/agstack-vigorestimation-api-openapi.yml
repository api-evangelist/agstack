        schema:
          type: string
          enum:
          - json
          - jsonld
      - in: query
        name: fromDate
        schema:
          type: string
          format: date-time
      - in: query
        name: parcel
        schema:
          type: string
          format: uuid
      - in: query
        name: title
        schema:
          type: string
      - in: query
        name: toDate
        schema:
          type: string
          format: date-time
      tags:
      - VigorEstimation
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/ld+json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/VigorEstimationObservation'
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/VigorEstimationObservation'
          description: ''
      summary: Api v1 vigor estimation list
      x-summary-source: derived
