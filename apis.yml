description: AgStack Foundation is a Linux Foundation project providing open-source digital infrastructure
  for the agriculture sector. Key projects include the Asset Registry (global field boundary registration
  with unique geo IDs), the OpenAgri Weather Service (agricultural weather forecasts, THI, spray conditions,
  UAV flight forecasts), and the OpenAgri Farm Calendar (farm operation recording with JSON-LD/OCSM linked
  data support). AgStack tools support EUDR compliance, precision agriculture, and interoperability across
  the agtech ecosystem through the OpenAgri Common Semantic Model.
