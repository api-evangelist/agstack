  - type: Features
    data:
      - name: Field Boundary Registry
        description: >-
          Global registry for agricultural field boundaries — submit WKT or GeoJSON geometry, receive a permanent unique
          16-character geo ID
      - name: Agricultural Weather Intelligence
        description: >-
          5-day weather forecasts, current conditions, and agricultural indicators including THI, spray conditions, and
          UAV flight suitability
      - name: Digital Farm Calendar
        description: >-
          Record and manage farm operations (planting, irrigation, spraying, harvesting) with linked data (JSON-LD/OCSM)
          output
      - name: Linked Data Support
        description: >-
          All APIs support JSON-LD output conforming to the OpenAgri Common Semantic Model (OCSM) for semantic
          interoperability
      - name: EUDR Compliance Support
        description: >-
          Tools for EU Deforestation Regulation compliance — field boundary registration and supply chain traceability
          via INATrace
      - name: Irrigation Management
        description: Evapotranspiration (ETo) calculations and soil moisture analysis for data-driven irrigation decisions
      - name: Open Source Infrastructure
        description: All tools are Apache-2.0 licensed, Docker-ready, and deployable on any cloud or on-premises infrastructure
  - type: UseCases
    data:
      - name: Farmer Field Registration
        description: >-
          Farmers and agri-cooperatives register field boundaries in the global asset registry to enable data-driven
          farm management
      - name: Crop Protection Planning
        description: >-
          Check spray conditions and UAV flight forecasts before applying pesticides or fertilizers to minimize drift
          and maximize efficacy
      - name: Livestock Heat Stress Monitoring
        description: Monitor Temperature-Humidity Index to detect and prevent heat stress events in dairy and beef cattle herds
      - name: EUDR Supply Chain Compliance
        description: >-
          Register plot geolocations and trace agricultural commodities through the supply chain to demonstrate
          zero-deforestation compliance
      - name: Precision Irrigation
        description: Use evapotranspiration data and soil moisture analysis to schedule irrigation and optimize water usage
      - name: Interoperable Agtech Integration
        description: Share agricultural data between platforms using JSON-LD/OCSM linked data format for semantic interoperability
  - type: Integrations
    data:
      - name: OpenWeatherMap
        description: Weather data source for current conditions and forecasts used by the OpenAgri Weather Service
      - name: OpenAgri
        description: EU Horizon Europe project (Grant No. 101134083) that funds and drives the OpenAgri microservices ecosystem
      - name: OCSM
        description: >-
          OpenAgri Common Semantic Model — linked data vocabulary for agricultural interoperability used across all
          OpenAgri APIs
      - name: INATrace
        description: Open-source blockchain-based track and trace system for agricultural supply chains
      - name: TerraTrac
        description: >-
          TechnoServe Labs mobile and web application for EUDR compliance field data collection integrated with the
          asset registry
